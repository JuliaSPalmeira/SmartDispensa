spring.application.name=smartdispensa

# Configuração do Banco de Dados H2 em Memória
spring.datasource.url=jdbc:h2:mem:smartdispensadb;DB_CLOSE_DELAY=-1;NON_KEYWORDS=KEY,VALUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configurações do Hibernate para compatibilidade com H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Habilitar o painel visual do H2 no navegador
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
