version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: smartdispensa-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: smartdispensa
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
